[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mall-api-test-practice"
version = "0.1.0"
description = "Student API testing practice project using the open-source Mall system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
    "pytest>=8,<9",
    "jsonschema>=4.22,<5",
    "allure-pytest>=2.13,<3",
    "PyMySQL>=1.1,<2",
    "python-dotenv>=1.0,<2",
]

[tool.setuptools.packages.find]
include = ["malltest*"]

[tool.ruff]
line-length = 100
target-version = "py310"
