[pytest]
testpaths = tests
addopts = -ra
markers =
    unit: framework tests that do not need the system under test
    api: HTTP API tests against the Mall system under test
    smoke: small read-only set for a quick health check
    mutating: tests that create or delete data in the system under test
    db: tests that read MySQL directly
filterwarnings =
    ignore::DeprecationWarning
